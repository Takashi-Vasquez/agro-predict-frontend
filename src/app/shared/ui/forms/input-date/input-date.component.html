<!-- input-date.component.html -->
<div class="form-field">
  <label [for]="id()">
    {{ label() }}
    @if (required()) {
      <span class="required">*</span>
    }
  </label>

  <input
    agroInput
    [id]="id()"
    type="date"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    [min]="min()"
    [max]="max()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (error()) {
    <span class="field-error">{{ error() }}</span>
  }
</div>
