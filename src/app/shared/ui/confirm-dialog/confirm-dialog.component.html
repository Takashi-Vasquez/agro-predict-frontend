<div class="dialog-content">
  <h2 mat-dialog-title>{{ data.title }}</h2>
  <p>{{ data.message }}</p>
  <div class="dialog-actions">
    @if (data.cancel) {
      <button agroButton (click)="ref.close(false)" [disabled]="loading()">
        {{ data.cancel }}
      </button>
    }
    <button agroButton="primary" (click)="confirm()" [disabled]="loading()">
      {{ loading() ? 'Procesando...' : data.confirm }}
    </button>
  </div>
</div>
