<agro-page-header
  title="Datos historicos"
  description="Entrena con campañas históricas y proyecta la cosecha individual o masivamente."
  eyebrow="INTELIGENCIA AGRÍCOLA"
>
  <a agroButton class="cursor-pointer" (click)="goBack()">
    <ng-icon name="heroArrowLeftEndOnRectangleMicro" agroColor="blue"></ng-icon>
    Volver
  </a>
</agro-page-header>

<agro-card>
  <div class="toolbar">
    <agro-search-field
      placeholder="Buscar registros…"
      ariaLabel="Buscar registros"
      (searchChange)="searchTerm.set($event)"
    />

    <div class="flex gap-2">
      <button
        agroButton="ghost"
        class="mr-(2)"
        *appHasPermission="'EXPORT'"
        (click)="exportTable()"
      >
        <ng-icon name="matDownloading" />
        Exportar
      </button>
      <button agroButton="ghost" class="mr-(2)" (click)="records.reload()">
        <ng-icon name="heroArrowPathSolid"></ng-icon>
      </button>

      <span class="text-xs muted content-center">{{ rows().length }} registros</span>
    </div>
  </div>

  @if (records.isLoading()) {
    <agro-loader />
  } @else if (records.error()) {
    <agro-empty title="Error" description="No se pudieron cargar los datos" />
  } @else {
    <agro-data-table
      [columns]="columns()"
      [rows]="rows()"
      [actionsTemplate]="actionsTpl"
      [paginate]="true"
      caption="Datos historicos de cultivos"
    />

    @if (!records.value().length) {
      <agro-empty
        title="No encontramos registros"
        description="Aún no se han registrado datos historicos."
      />
    }
  }
</agro-card>

<ng-template #actionsTpl let-row>
  @if (row.status == 'ACTIVE') {
    <button agroButton="ghost" *appHasPermission="'DELETE'" (click)="remove(row)" title="Eliminar">
      <ng-icon name="heroTrash" agroColor="danger"></ng-icon>
    </button>
  }
</ng-template>

<ng-template #isTrainedTpl let-row="row">
  <span class="status" [class.success]="isTrained(row)" [class.danger]="!isTrained(row)">
    {{ row.isTrained }}
  </span>
</ng-template>
