<agro-page-header
  title="Gestión de Perfil de accesos"
  description="Administra los permisos de usuario."
  eyebrow="SEGURIDAD"
>
  <button agroButton="primary" (click)="createOrUpdate()">
    <ng-icon name="heroPlusMicro"></ng-icon>
    Nuevo Perfil
  </button>
</agro-page-header>

<agro-card>
  <div class="toolbar">
    <agro-search-field
      placeholder="Buscar permisos…"
      ariaLabel="Buscar permisos"
      (searchChange)="searchTerm.set($event)"
    />

    <div class="flex gap-2">
      <button agroButton="ghost" class="mr-(2)" (click)="accessProfile.reload()">
        <ng-icon name="heroArrowPathSolid"></ng-icon>
      </button>
      <span class="text-xs muted content-center">{{ rows().length }} registros</span>
    </div>
  </div>

  @if (accessProfile.isLoading()) {
    <agro-loader />
  } @else if (accessProfile.error()) {
    <agro-empty title="Error" description="No se pudieron cargar los datos" />
  } @else {
    <agro-data-table
      [columns]="columns()"
      [rows]="rows()"
      [actionsTemplate]="actionsTpl"
      [paginate]="true"
      caption="Perfil de acceso del sistema"
    />

    @if (!accessProfile.value().length) {
      <agro-empty
        title="No encontramos permisos"
        description="Aún no se han registrado permisos."
      />
    }
  }
</agro-card>

<ng-template #actionsTpl let-row>
  <button agroButton="ghost" (click)="createOrUpdate(row)" title="Editar">
    <ng-icon name="heroPencil" agroColor="blue"></ng-icon>
  </button>
  <button agroButton="ghost" (click)="remove(row)" title="Eliminar">
    <ng-icon name="heroTrash" agroColor="danger"></ng-icon>
  </button>
</ng-template>
